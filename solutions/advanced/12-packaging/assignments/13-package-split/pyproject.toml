[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wordtools"
version = "1.0.0"
description = "Small tools for words: slugs, counts and frequencies."
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
wordtools = "wordtools.cli:main"

[tool.setuptools]
packages = ["wordtools"]
